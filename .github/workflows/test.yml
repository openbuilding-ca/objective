name: Tests

# On demand only (Andy 2026-10-31): Actions > Tests > Run workflow, or `gh workflow run test.yml`.
# Run the suite locally before a PR: npm test (the unit tests, then Playwright).
on:
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-24.04  # not -latest: 26.04 has no Playwright 1.56.1 WebKit
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # test/*.test.cjs, plain node, no browser. They require() the src/ files,
      # which are ES modules here: that needs Node 20.19+ or 22.12+.
      # test/climateStation.test.cjs is not in this set - it reads CWEC EPW
      # files that are not in the repo (npm run test:unit:climate).
      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps webkit

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

